name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — lint + testes
    runs-on: ubuntu-latest

    # Valores FALSOS de propósito. Estes testes são adversariais e usam mocks —
    # não precisam de credencial real, como o próprio nome do step diz.
    #
    # Dois motivos para não usar os secrets reais aqui:
    #  1. Segurança: não há razão para a chave service_role e a string do banco de
    #     PRODUÇÃO passearem pelo ambiente de todo run de CI.
    #  2. Correção: com o secret ausente, o valor vira string VAZIA — e
    #     `assert cfg.supabase_service_role_key not in prompt` falha sempre, porque
    #     string vazia está contida em qualquer texto. Com um valor falso não-vazio,
    #     o teste volta a testar o que promete: que a chave não vaza no system prompt.
    env:
      SUPABASE_URL: https://ci-fake-nao-usar.supabase.co
      SUPABASE_ANON_KEY: ci-fake-anon-key-nao-usar
      SUPABASE_SERVICE_ROLE_KEY: ci-fake-service-role-key-nao-usar
      ANTHROPIC_API_KEY: ci-fake-anthropic-key-nao-usar
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_nao_existe
      SECRET_KEY: ci-secret-key-nao-usar-em-producao
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          # pytest/pytest-asyncio não estão no requirements.txt (que é de runtime),
          # mas os testes são async e não rodam sem eles — sem isso o passo de
          # testes morre com exit 127 (comando não encontrado).
          # ruff PINADO. Sem pin, o `pip install ruff` pega a última versão e a CI
          # quebra sozinha quando sai release com regras novas — foi o que aconteceu
          # em 27/07/2026: a 0.16.0 subiu e passou de 0 para 93 apontamentos sem
          # ninguém tocar no código. Para subir de versão, faça de propósito, num
          # commit só disso, tratando os apontamentos novos.
          pip install ruff==0.15.21 pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check app/

      - name: Testes adversariais, de Relatórios e do Saldo do período (sem credenciais externas)
        run: pytest tests/test_adversarial.py tests/test_relatorios.py tests/test_dashboard_saldo_periodo.py -v --tb=short

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # A CI ficou vermelha desde a criação até 13/07/2026 sem ninguém agir. Job
  # separado (em vez de um passo em cada job acima) para não duplicar o alerta
  # quando backend e frontend quebram juntos.
  alerta:
    name: Avisar em caso de falha
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Só no master: falha em PR já aparece no próprio PR, abrir issue seria ruído.
    if: failure() && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir ou comentar issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "CI quebrada no master"
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CORPO="A CI falhou no \`master\` em $(date -u '+%d/%m/%Y %H:%M UTC').

          - Run: $URL_RUN
          - Commit: \`${{ github.sha }}\`

          Backend: \`${{ needs.backend.result }}\` — Frontend: \`${{ needs.frontend.result }}\`

          Feche esta issue depois de corrigir; ela é reaproveitada nas próximas falhas."

          EXISTENTE=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq "[.[] | select(.title == \"$TITULO\")][0].number")

          if [ -n "$EXISTENTE" ] && [ "$EXISTENTE" != "null" ]; then
            gh issue comment "$EXISTENTE" --repo "${{ github.repository }}" --body "$CORPO"
            echo "Comentei na issue #$EXISTENTE."
          else
            # Sem --assignee: o dono do repo é a ORG mxseguros e o GitHub não aceita
            # atribuir issue a organização — o alerta falharia junto com o job.
            # O || garante a issue mesmo se a label 'automacao' for apagada.
            gh issue create --repo "${{ github.repository }}" --title "$TITULO" \
              --body "$CORPO" --label automacao \
              || gh issue create --repo "${{ github.repository }}" --title "$TITULO" --body "$CORPO"
          fi
