# Migração one-off: copia o banco de PRODUÇÃO para outro projeto Supabase.
#
# Por que roda aqui e não na máquina do Gabriel: a rede dele bloqueia as portas
# 5432 e 6543 (testado: TcpTestSucceeded=False nas duas), então pg_dump/pg_restore
# não conectam de lá. O runner do GitHub alcança o pooler — é o mesmo caminho que
# o backup-diario usa com sucesso todo dia. Bônus: os dados vão direto de um
# Supabase para o outro, sem passar por máquina nenhuma.
#
# SECRETS NECESSÁRIOS:
#   DATABASE_URL           origem (já cadastrado — é o que o backup-diario usa)
#   DATABASE_URL_DESTINO   destino, pooler em session mode (porta 5432).
#                          A senha precisa ir PERCENT-ENCODED na URI:
#                          @ -> %40   # -> %23   ! -> %21
#
# ORDEM DO RESTORE (não inverter): auth.users PRIMEIRO, public depois.
# A tabela public.usuarios tem FK para auth.users(id); restaurar public antes
# quebraria com violação de chave estrangeira em toda linha de usuário.
#
# APAGUE ESTE ARQUIVO DEPOIS DE MIGRAR, junto com o secret DATABASE_URL_DESTINO.
# É one-off: mantê-lo no repositório deixa um botão "escrever por cima de um
# banco" permanentemente a um clique de distância, sem nenhuma razão de existir.

name: migrar-supabase

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escreva MIGRAR para confirmar a escrita no banco de DESTINO'
        required: true
        default: ''

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Exigir confirmação explícita
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "MIGRAR" ]; then
            echo "::error::Confirmação ausente. Rode de novo escrevendo MIGRAR no campo."
            exit 1
          fi

      - name: Conferir secrets
        env:
          ORIGEM: ${{ secrets.DATABASE_URL }}
          DESTINO: ${{ secrets.DATABASE_URL_DESTINO }}
        run: |
          [ -n "$ORIGEM" ]  || { echo "::error::secret DATABASE_URL ausente.";         exit 1; }
          [ -n "$DESTINO" ] || { echo "::error::secret DATABASE_URL_DESTINO ausente."; exit 1; }
          if [ "$ORIGEM" = "$DESTINO" ]; then
            echo "::error::ORIGEM e DESTINO são iguais — abortando antes de fazer besteira."
            exit 1
          fi

      # Mesmo procedimento do backup-diario: o runner traz o client 16, que se
      # recusa a dumpar um servidor 17 ("server version mismatch").
      - name: Instalar postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Conferir versões
        run: |
          pg_dump --version | grep -q " 17\." || { echo "::error::pg_dump não é 17."; exit 1; }
          pg_restore --version | grep -q " 17\." || { echo "::error::pg_restore não é 17."; exit 1; }
          psql --version

      # Trava de segurança: só migra para um destino VAZIO. Restaurar por cima de
      # um banco com dados misturaria dois estados sem forma limpa de desfazer.
      - name: Destino precisa estar vazio
        env:
          DESTINO: ${{ secrets.DATABASE_URL_DESTINO }}
        run: |
          TABELAS=$(psql "$DESTINO" -tAc \
            "select count(*) from information_schema.tables where table_schema='public';")
          USUARIOS=$(psql "$DESTINO" -tAc "select count(*) from auth.users;")
          echo "destino: $TABELAS tabelas em public, $USUARIOS usuários em auth"
          if [ "$TABELAS" -ne 0 ] || [ "$USUARIOS" -ne 0 ]; then
            echo "::error::O destino NÃO está vazio ($TABELAS tabelas, $USUARIOS usuários). Abortando."
            exit 1
          fi

      - name: Dump da origem (somente leitura)
        env:
          ORIGEM: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump "$ORIGEM" \
            --format=custom \
            --schema=public \
            --schema=auth \
            --no-owner \
            --no-privileges \
            --file=origem.dump
          TAM=$(stat -c%s origem.dump)
          echo "dump: $TAM bytes"
          # O banco tem ~15 MB; um dump saudável passa longe de 100 KB.
          [ "$TAM" -ge 102400 ] || { echo "::error::dump suspeito ($TAM bytes)."; exit 1; }
          pg_restore --list origem.dump > /dev/null
          echo "dump íntegro."

      # PRIMEIRO os usuários. --data-only porque o schema auth já existe no projeto
      # novo, criado pelo próprio Supabase — recriar as tabelas quebraria o serviço
      # de auth dele. Só as duas tabelas que importam para login continuar valendo.
      - name: Restaurar auth.users e auth.identities (só dados)
        env:
          DESTINO: ${{ secrets.DATABASE_URL_DESTINO }}
        run: |
          pg_restore \
            --data-only \
            --schema=auth \
            --table=users \
            --table=identities \
            --no-owner \
            --no-privileges \
            --dbname="$DESTINO" \
            origem.dump
          echo "usuários restaurados: $(psql "$DESTINO" -tAc 'select count(*) from auth.users;')"

      # DEPOIS o schema de negócio, cujas FKs já encontram os usuários no lugar.
      - name: Restaurar schema public (estrutura + dados)
        env:
          DESTINO: ${{ secrets.DATABASE_URL_DESTINO }}
        run: |
          # --exit-on-error NÃO é usado de propósito: o restore emite avisos
          # benignos (comment on extension, grants a roles internos do Supabase que
          # têm outro OID). O passo de verificação abaixo é quem julga o resultado.
          pg_restore \
            --schema=public \
            --no-owner \
            --no-privileges \
            --dbname="$DESTINO" \
            origem.dump 2>&1 | tee restore.log || true
          echo "--- erros reais no log (se houver) ---"
          grep -iE "^pg_restore: error" restore.log || echo "(nenhum)"

      # Contagem lado a lado: é isto que prova a migração, não o exit code.
      - name: Verificar — contagem nas duas pontas
        env:
          ORIGEM: ${{ secrets.DATABASE_URL }}
          DESTINO: ${{ secrets.DATABASE_URL_DESTINO }}
        run: |
          FALHOU=0
          # Enumera as tabelas da ORIGEM em vez de usar lista fixa: assim uma
          # tabela que não chegou ao destino aparece como erro, e não some da
          # verificação por não estar numa lista escrita à mão.
          TABELAS=$(psql "$ORIGEM" -tAc \
            "select tablename from pg_tables where schemaname='public' order by tablename;")
          echo "| tabela | origem | destino |"
          echo "|---|---:|---:|"
          for T in $TABELAS; do
            A=$(psql "$ORIGEM"  -tAc "select count(*) from public.\"$T\";" 2>/dev/null || echo "ERRO")
            B=$(psql "$DESTINO" -tAc "select count(*) from public.\"$T\";" 2>/dev/null || echo "AUSENTE")
            echo "| $T | $A | $B |"
            [ "$A" = "$B" ] || FALHOU=1
          done
          UA=$(psql "$ORIGEM"  -tAc "select count(*) from auth.users;")
          UB=$(psql "$DESTINO" -tAc "select count(*) from auth.users;")
          echo "| auth.users | $UA | $UB |"
          [ "$UA" = "$UB" ] || FALHOU=1

          RLS=$(psql "$DESTINO" -tAc \
            "select count(*) from pg_policies where schemaname='public';")
          echo ""
          echo "políticas RLS no destino: $RLS"
          [ "$RLS" -gt 0 ] || { echo "::error::nenhuma política RLS no destino."; FALHOU=1; }

          if [ "$FALHOU" -ne 0 ]; then
            echo "::error::Divergência entre origem e destino — revise antes de apontar a aplicação."
            exit 1
          fi
          echo "Contagens batem em todas as tabelas verificadas."

      # O dump fica só no runner e some com ele. Não vira artifact de propósito:
      # o backup-diario já guarda dump criptografado, e este aqui estaria em claro.
      - name: Apagar o dump do runner
        if: always()
        run: rm -f origem.dump restore.log
