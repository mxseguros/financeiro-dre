# Monitoramento IA — execução diária.
#
# Roda scripts/monitor_diario.py: checagens determinísticas (duplicatas,
# pendentes, outliers, gap de recorrência) + resumo por IA, e guarda o
# snapshot JSON como artifact do workflow por 30 dias.
#
# REQUISITO (uma vez, manual): cadastrar os secrets no GitHub —
#   Settings → Secrets and variables → Actions → New repository secret
#   - SUPABASE_URL
#   - SUPABASE_ANON_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
#   - ANTHROPIC_API_KEY        (opcional — sem ele, roda só o determinístico)
# Sem os 3 do Supabase o job falha no primeiro passo, sem efeito colateral.

name: monitoramento-ia-diario

on:
  schedule:
    - cron: "0 11 * * *"    # 11:00 UTC ≈ 08:00 em Brasília, diário
  workflow_dispatch: {}      # permite disparo manual na aba Actions

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # O padrão do repositório é read-only; o passo de alerta precisa abrir issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar Monitoramento IA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/monitor_diario.py

      - name: Publicar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ github.run_id }}
          path: monitor_out/
          retention-days: 30

      # Este workflow falhou em silêncio de 06/07 a 27/07/2026 (secrets do Supabase
      # nunca cadastrados) e ninguém notou — e-mail de falha do GitHub se perde na
      # caixa de entrada. Abrir uma issue ATRIBUÍDA ao dono força a notificação e,
      # ao contrário do e-mail, deixa um rastro visível que só some quando alguém
      # fecha. Se já houver uma issue aberta, só comenta nela: uma falha que se
      # repete por 20 dias vira 1 issue com 20 comentários, não 20 issues.
      - name: Avisar em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "Falha no monitoramento diário"
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CORPO="O workflow \`monitoramento-ia-diario\` falhou em $(date -u '+%d/%m/%Y %H:%M UTC').

          - Run: $URL_RUN
          - Commit: \`${{ github.sha }}\`
          - Disparo: \`${{ github.event_name }}\`

          Causa mais provável (já aconteceu): algum secret do Supabase ausente ou
          expirado. Confira com \`gh secret list\` — o job precisa de SUPABASE_URL,
          SUPABASE_ANON_KEY e SUPABASE_SERVICE_ROLE_KEY.

          Feche esta issue depois de corrigir; ela é reaproveitada nas próximas falhas."

          # --repo explícito: não depender do diretório do checkout.
          EXISTENTE=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq "[.[] | select(.title == \"$TITULO\")][0].number")

          if [ -n "$EXISTENTE" ] && [ "$EXISTENTE" != "null" ]; then
            gh issue comment "$EXISTENTE" --repo "${{ github.repository }}" --body "$CORPO"
            echo "Comentei na issue #$EXISTENTE."
          else
            # Sem --assignee: o dono do repo é a ORG mxseguros e o GitHub não aceita
            # atribuir issue a organização — o alerta falharia junto com o job.
            # O || garante a issue mesmo se a label 'automacao' for apagada.
            gh issue create --repo "${{ github.repository }}" --title "$TITULO" \
              --body "$CORPO" --label automacao \
              || gh issue create --repo "${{ github.repository }}" --title "$TITULO" --body "$CORPO"
          fi
