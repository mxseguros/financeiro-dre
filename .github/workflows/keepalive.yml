# Mantém o backend da Railway acordado, evitando cold start
# ("Failed to fetch" na primeira requisição após inatividade).
name: Keep-alive backend

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos
  workflow_dispatch: {}       # permite disparo manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sS --max-time 30 -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            https://alert-patience-production-86b7.up.railway.app/health
